name: Documentation issue
description: Report unclear, missing, outdated, or incorrect JR Bar documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private prompts, transcripts, account identifiers, private paths, or personal data. Share a public documentation URL or page title when possible.
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Which public page, file, or section needs attention?
      placeholder: README, docs/..., or public URL
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
      description: Quote only short, non-sensitive text and explain the problem.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Describe the correction or missing guidance.
