name: Build Python release artifacts (manual)

# The JR fork is released locally from a signed Mac through
# scripts/publish_release.sh. This workflow is a manual Python-only fallback
# and deliberately does not publish the upstream-owned `sidepulse` name to PyPI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.2"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CONSTRAINT: requirements/release-constraints.txt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development tools
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --constraint requirements/release-constraints.txt -e '.[dev]'
      - name: Verify tag and build artifacts
        run: |
          python scripts/validate_release_version.py --tag "${{ inputs.tag }}"
          ./scripts/verify.sh --no-bootstrap --portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidepulse-${{ inputs.tag }}-python
          path: dist/
          if-no-files-found: error
