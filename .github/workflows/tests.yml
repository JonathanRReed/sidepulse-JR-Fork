name: Tests (manual)

# Hosted minutes are opt-in. The self-hosted workflow is the no-credit macOS
# path when a reviewed SidePulse runner is connected.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidepulse-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  portable:
    name: Portable Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Verify portable surfaces
        run: ./scripts/verify.sh --no-bootstrap --portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidepulse-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  macos:
    name: Full macOS Python ${{ matrix.python-version }}
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development tools
        run: python -m pip install -e '.[dev]'
      - name: Full suite
        run: python -m pytest tests -q
