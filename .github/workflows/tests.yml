name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: sidepulse-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Absolute: setup-python's internal pip upgrade runs outside the workspace,
  # and a relative constraint path kills the job before the first real step.
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release-constraints.txt

jobs:
  security:
    name: Security checks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned development tools
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --constraint requirements/release-constraints.txt -e '.[dev]'
      - name: Run security regression checks
        run: >-
          python -m pytest -q
          tests/test_app_bundle_security.py
          tests/test_dependency_and_entitlements.py
          tests/test_persistence_integration_contract.py
          tests/test_pro_identity_and_brightness.py
          tests/test_weather_network_bounds.py
          tests/test_workflow_contract.py

  portable:
    name: Portable Python ${{ matrix.python-version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned development tools
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --constraint requirements/release-constraints.txt -e '.[dev]'
      - name: Verify portable surfaces
        # verify.sh defaults to the repo-local .venv; on CI the pinned tools
        # live in the setup-python interpreter, so hand it over explicitly.
        run: ./scripts/verify.sh --no-bootstrap --portable
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidepulse-python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error

  macos:
    name: Full macOS Python ${{ matrix.python-version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned development tools
        run: |
          python -m pip install pip==26.1.2
          python -m pip install --constraint requirements/release-constraints.txt -e '.[dev]'
      - name: Full suite
        run: python -m pytest tests -q
