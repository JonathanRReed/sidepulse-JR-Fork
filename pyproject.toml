[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sidepulse"
version = "0.2.2"
description = "Command-line and macOS tools for SidePulse Pro and SidePulse Dot."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Kuhar", email = "peter@pkuhar.com" }]
maintainers = [{ name = "Jonathan Reed", email = "Contact@JonathanRReed.com" }]
keywords = ["sidepulse", "led", "macbook", "agent", "status", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pyobjc-framework-Cocoa==12.2.1; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.1; sys_platform == 'darwin'",
    # WebKit also provides the JavaScriptCore bindings led_wasm needs.
    "pyobjc-framework-WebKit==12.2.1; sys_platform == 'darwin'",
    # Calendar alerts ("glow before events start") use EventKit.
    "pyobjc-framework-EventKit==12.2.1; sys_platform == 'darwin'",
    # Native provider secrets stay in macOS Keychain.
    "keyring==25.7.0; sys_platform == 'darwin'",
    # Read Chromium localStorage from an isolated copied LevelDB snapshot.
    "rleveldb==1.0.0; sys_platform == 'darwin'",
    # Preserve comments and formatting while editing Hermes YAML config.
    "ruamel.yaml==0.19.1",
]

[project.urls]
Homepage = "https://sidepulse.io"
Repository = "https://github.com/JonathanRReed/sidepulse-JR-Fork"
Issues = "https://github.com/JonathanRReed/sidepulse-JR-Fork/issues"
Upstream = "https://github.com/inteliwear/sidepulse"

[project.optional-dependencies]
# Backwards-compatible alias. Status-bar dependencies install by default.
status-bar = []
test = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "tomli==2.4.1; python_version < '3.11'",
]
dev = [
    "build==1.5.0",
    "pytest==9.1.1",
    "ruff==0.16.3",
    "tomli==2.4.1; python_version < '3.11'",
    "twine==6.2.0",
    "wheel==0.47.0",
]

[project.scripts]
sidepulse = "sidepulse.cli_entry:sidepulse_main"
sidepulse-integrations = "sidepulse.integration_cli:main"
agent-monitor = "sidepulse.cli:main"
agent-status-bar = "sidepulse.provider_usage_status_bar:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sidepulse*", "agent_monitor*", "sidepulse_cli*"]

[tool.setuptools.package-data]
"sidepulse.resources" = [
    "integration_compatibility.json",
    "sd_eject_guard.c",
    "sdled.wasm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
# Keep the lint surface deterministic. The retained AppKit controller is frozen
# behind status_bar.py; all new behavior belongs in linted, testable modules.
line-length = 120
extend-exclude = ["src/sidepulse/status_bar_legacy.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# En dash / minus sign appear deliberately in user-facing copy.
allowed-confusables = ["\u2013", "\u2212"]
ignore = [
    "RUF046",  # int(len(...)) casts kept for PyObjC bridge clarity
    "RUF059",  # unpacked-but-unused tuple parts document payload shape
]

[tool.ruff.lint.per-file-ignores]
# These exceptions document inherited, non-functional ordering debt. They are
# intentionally narrow: undefined-name, syntax, and correctness checks remain
# enabled, and every newly extracted module must pass without exceptions.
"src/sidepulse/settings.py" = ["I001"]
"src/sidepulse/_settings_legacy.py" = ["I001"]
"src/sidepulse/settings_window.py" = ["F821"]
"src/sidepulse/usage_card.py" = ["RUF022"]
"src/sidepulse/virtual_device.py" = ["I001"]
"tests/test_capacity_authority.py" = ["I001"]
"tests/test_claude_limits_reachable.py" = ["I001"]
"tests/test_first_run_honesty.py" = ["I001"]
"tests/test_hook_import_cost.py" = ["I001"]
"tests/test_screen_bar_colour_matches_hardware.py" = ["I001"]
"tests/test_subagents_are_never_counted.py" = ["F401", "I001", "RUF015"]
"tests/test_usage_cache_bounds.py" = ["I001"]
