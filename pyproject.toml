[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sidepulse"
version = "0.2.1"
description = "Command-line and macOS tools for SidePulse Pro and SidePulse Dot."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Kuhar", email = "peter@pkuhar.com" }]
keywords = ["sidepulse", "led", "macbook", "agent", "status", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    # WebKit also provides the JavaScriptCore bindings led_wasm needs
    # (the wheel ships the JavaScriptCore module itself -- there is no
    # separate pyobjc-framework-JavaScriptCore distribution).
    "pyobjc-framework-WebKit>=10; sys_platform == 'darwin'",
    # Calendar alerts ("glow before events start") -- see calendar_watch.py.
    "pyobjc-framework-EventKit>=10; sys_platform == 'darwin'",
    # Round-trip YAML editing for the Hermes Agent hook installer --
    # ruamel preserves the user's own comments and formatting in
    # ~/.hermes/config.yaml, which plain PyYAML would destroy.
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://sidepulse.io"
Repository = "https://github.com/inteliwear/sidepulse"
Issues = "https://github.com/inteliwear/sidepulse/issues"

[project.optional-dependencies]
# Kept for backwards compatibility; the status-bar dependencies are installed by
# default now, so this extra is a no-op alias.
status-bar = []
reply-classifier = ["mlx-lm>=0.24,<1"]

[project.scripts]
sidepulse = "sidepulse.cli:sidepulse_main"
agent-monitor = "sidepulse.cli:main"
agent-status-bar = "sidepulse.status_bar:main"
sidepulse-reply = "sidepulse.reply_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sidepulse*"]

[tool.setuptools.package-data]
"sidepulse.resources" = ["sd_eject_guard.c", "sdled.wasm"]

[tool.ruff]
# Pin the lint surface: ruff 0.16's expanded defaults flag this app's
# deliberate quiet-failure excepts (BLE001/S110 -- watchers and TCC
# probes are DESIGNED to swallow errors and back off quietly).
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
# En dash / minus sign appear deliberately in user-facing copy.
allowed-confusables = ["\u2013", "\u2212"]
ignore = [
    "RUF046",  # int(len(...)) casts kept for PyObjC bridge clarity
    "RUF059",  # unpacked-but-unused tuple parts document payload shape
]

[tool.ruff.lint.per-file-ignores]
# settings_window.py runs against status_bar's namespace, installed at
# runtime (see its module docstring) -- undefined-name analysis cannot
# see injected globals.
"src/sidepulse/settings_window.py" = ["F821"]
